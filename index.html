<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GYAN E-Library</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
margin: 0;
font-family: 'Poppins', sans-serif;
background: #0f172a;
color: #e5e7eb;
}

/* Navbar */
nav {
display: flex;
justify-content: space-between;
padding: 15px 30px;
background: rgba(255,255,255,0.05);
backdrop-filter: blur(10px);
position: sticky;
top: 0;
}

nav h2 {
color: #facc15;
}

/* Hero Section */
.hero {
text-align: center;
padding: 80px 20px;
}

.hero h1 {
font-size: 40px;
color: #facc15;
}

.hero p {
color: #cbd5f5;
}

/* Button */
.btn {
padding: 12px 25px;
border-radius: 25px;
border: none;
cursor: pointer;
margin: 10px;
font-size: 16px;
}

.primary {
background: #facc15;
color: #000;
}

.secondary {
background: #38bdf8;
color: #000;
}

/* Cards */
.container {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
gap: 20px;
padding: 40px;
}

.card {
background: rgba(255,255,255,0.05);
padding: 20px;
border-radius: 15px;
backdrop-filter: blur(10px);
transition: 0.3s;
}

.card:hover {
transform: translateY(-8px);
box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

/* Footer */
footer {
text-align: center;
padding: 20px;
background: rgba(255,255,255,0.05);
}

/* WhatsApp Floating Button */
.whatsapp {
position: fixed;
bottom: 20px;
right: 20px;
background: #25D366;
padding: 15px;
border-radius: 50%;
text-decoration: none;
color: white;
font-size: 20px;
}
</style>

</head>

<body>

<nav>
<h2>GYAN E-Library</h2>
<div>
<button class="btn primary">Book Seat</button>
</div>
</nav>

<section class="hero">
<h1>Silent Study Zone 📚</h1>
<p>Best place for focused study in Karanprayag</p>
<button class="btn primary">Join Now</button>
<button class="btn secondary">View Plans</button>
</section>

<section class="container">
<div class="card">
<h3>📍 Location</h3>
<p>Shakti Nagar, Karanprayag, Chamoli</p>
</div>

<div class="card">
<h3>🎯 Features</h3>
<p>WiFi, CCTV, Silent Environment, Comfortable Seating</p>
</div>

<div class="card">
<h3>💰 Pricing</h3>
<p>Affordable Monthly Plans Available</p>
</div>
</section>

<footer>
<p>© 2026 GYAN E-Library | All Rights Reserved</p>
</footer>

<a href="https://wa.me/91XXXXXXXXXX" class="whatsapp">💬</a>

</body>
</html>
