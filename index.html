<style>
body {
margin: 0;
font-family: 'Poppins', sans-serif;
color: white;
}

/* Background with library image */
.hero {
background: url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f') no-repeat center center/cover;
height: 100vh;
text-align: center;
padding-top: 80px;
}

/* Dark overlay */
.hero::before {
content: "";
position: absolute;
top: 0; left: 0;
width: 100%;
height: 100%;
background: rgba(0,0,0,0.6);
}

/* Content */
.hero-content {
position: relative;
z-index: 1;
}

/* Title */
.hero h1 {
font-size: 70px;
font-weight: 800;
color: #facc15;
}

.hero h2 {
font-size: 30px;
}

.hero p {
font-size: 18px;
}

/* Buttons */
.btn {
padding: 14px 30px;
border-radius: 30px;
border: none;
margin: 10px;
font-size: 16px;
cursor: pointer;
}

.primary {
background: #facc15;
color: black;
}

.secondary {
background: #22c55e;
color: black;
}

/* Contact (VISIBLE now) */
.contact {
background: #111;
text-align: center;
padding: 30px;
}

.contact a {
color: #facc15;
font-size: 20px;
text-decoration: none;
}

/* Cards */
.container {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
gap: 20px;
padding: 40px;
background: #111;
}

.card {
background: #1f2937;
padding: 20px;
border-radius: 15px;
text-align: center;
}
</style>

</head>

<body>
