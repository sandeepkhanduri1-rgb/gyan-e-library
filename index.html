<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GYAN E-Library</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">

<style>
body {
margin: 0;
font-family: 'Poppins', sans-serif;
background: linear-gradient(135deg, #1e3a8a, #9333ea, #0ea5e9);
color: white;
}

/* Navbar */
nav {
display: flex;
justify-content: space-between;
padding: 20px 40px;
}

nav h1 {
font-size: 32px;
font-weight: 800;
letter-spacing: 2px;
}

/* Hero */
.hero {
text-align: center;
padding: 80px 20px;
}

.hero h1 {
font-size: 70px;
font-weight: 800;
background: linear-gradient(90deg, #facc15, #22c55e);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}

.hero h2 {
font-size: 30px;
margin-top: 10px;
}

.hero p {
margin-top: 10px;
font-size: 18px;
}

/* Buttons */
.btn {
padding: 14px 30px;
border-radius: 30px;
border: none;
margin: 15px;
font-size: 16px;
cursor: pointer;
}

.primary {
background: #facc15;
color: black;
}

.secondary {
background: #22c55e;
color: black;
}

/* Cards */
.container {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
gap: 20px;
padding: 40px;
}

.card {
background: rgba(255,255,255,0.1);
padding: 25px;
border-radius: 20px;
backdrop-filter: blur(10px);
text-align: center;
transition: 0.3s;
}

.card:hover {
transform: scale(1.05);
}

/* Footer */
footer {
text-align: center;
padding: 20px;
}
</style>

</head>

<body>

<nav>
<h1>GYAN E-LIBRARY</h1>
<button class="btn primary">Book Seat</button>
</nav>

<section class="hero">
<h1>GYAN E-LIBRARY</h1>
<h2>📚 Silent Study Zone</h2>
<p>Best place for focused study in Karanprayag</p>

<button class="btn primary">Join Now</button>
<button class="btn secondary">View Plans</button>
</section>

<section class="container">
<div class="card">
<h3>📍 Location</h3>
<p>Shakti Nagar, Karanprayag, Chamoli</p>
</div>

<div class="card">
<h3>🎯 Features</h3>
<p>WiFi, CCTV, Silent Environment, Comfortable Seating</p>
</div>

<div class="card">
<h3>💰 Pricing</h3>
<p>Affordable Monthly Plans Available</p>
</div>
</section>

<footer>
<p>© 2026 GYAN E-Library</p>
</footer>

</body>
</html>
